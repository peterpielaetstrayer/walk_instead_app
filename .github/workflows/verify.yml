name: Walk Instead — Draft verification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static checks and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install pinned browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser flow smoke tests
        run: npx playwright test --config playwright.config.mjs
