name: Walk Instead — One-time draft dependency remediation

# This is deliberately triggered only by adding or editing this workflow file.
# The patch can only be pushed back to the unmerged design branch, never master.
on:
  push:
    branches:
      - design/v0-2-quiet-editorial-interruption-flow
    paths:
      - .github/workflows/one-time-dependency-refresh.yml

concurrency:
  group: walk-instead-dependency-remediation
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare and verify patched dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Pin reviewed security and browser-testing releases
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.dependencies.next = "16.4.5";
          pkg.devDependencies["eslint-config-next"] = "16.4.5";
          pkg.devDependencies["@playwright/test"] = "1.64.1";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE
      - name: Regenerate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply available nonbreaking transitive advisory patches
        run: npm audit fix --package-lock-only --ignore-scripts --omit=dev
      - name: Check lockfile installs reproducibly
        run: npm ci
      - name: Audit production dependency security
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage verified lockfile as reviewable artifact
        uses: actions/upload-artifact@v4
        with:
          name: walk-instead-security-upgrade
          path: |
            package.json
            package-lock.json
          retention-days: 7

  apply:
    name: Apply reviewed dependency files to draft branch only
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v0-2-quiet-editorial-interruption-flow
      - uses: actions/download-artifact@v4
        with:
          name: walk-instead-security-upgrade
          path: .
      - name: Commit patch only if package files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes necessary"
            exit 0
          fi
          git commit -m "Patch Next.js production advisories and pin Playwright test runner"
          git push origin HEAD:refs/heads/design/v0-2-quiet-editorial-interruption-flow
